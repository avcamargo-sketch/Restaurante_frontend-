<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante XYZ - Login</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/modals.css">
</head>
<body>
    <h1>Restaurante XYZ</h1>
    
    <section class="content">
        <!-- LOGIN -->
        <section id="loginSection">
            <h2>Iniciar Sesión</h2>
            <form name="loginForm">
                <div>
                    <label for="usuario">Usuario o Correo:</label>
                    <input type="text" name="usuario" required placeholder="admin">
                </div>
                <div>
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" name="contrasena" required placeholder="admin123">
                </div>
                <div>
                    <button type="submit">Ingresar</button>
                </div>
            </form>
        </section>
        
        <!-- MENÚ PRINCIPAL -->
        <section id="menuSection" style="display: none;">
            <h2>Menú Principal</h2>
            <nav>
                <button onclick="mostrarMesas()">Mesas</button>
                <button onclick="mostrarReservas()">Reservas</button>
                <button onclick="mostrarProductos()">Productos</button>
                <button onclick="mostrarPedidos()">Pedidos</button>
                <button onclick="cerrarSesion()">Cerrar Sesión</button>
            </nav>
        </section>
        
        <!-- SECCIÓN MESAS -->
        <section id="mesasSection" style="display: none;">
            <button onclick="volverMenu()" class="btn-volver">← Volver al Menú</button>
            <h2>Gestión de Mesas</h2>
            <button onclick="mostrarFormMesa()">Nueva Mesa</button>
            <div id="mesasContent"></div>
            
            <div id="mesaForm" style="display: none; margin-top: 20px;">
                <h3 id="mesaFormTitle">Nueva Mesa</h3>
                <form name="mesaForm">
                    <input type="hidden" name="id">
                    <div>
                        <label>Número:</label>
                        <input type="text" name="numero" required>
                    </div>
                    <div>
                        <label>Capacidad:</label>
                        <input type="number" name="capacidad" required min="1">
                    </div>
                    <div>
                        <label>Estado:</label>
                        <select name="estado">
                            <option value="disponible">Disponible</option>
                            <option value="reservada">Reservada</option>
                            <option value="ocupada">Ocupada</option>
                            <option value="fuera_servicio">Fuera de Servicio</option>
                        </select>
                    </div>
                    <div>
                        <button type="button" onclick="cancelarMesa()">Cancelar</button>
                        <button type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </section>
        
        <!-- SECCIÓN RESERVAS -->
        <section id="reservasSection" style="display: none;">
            <button onclick="volverMenu()" class="btn-volver">← Volver al Menú</button>
            <h2>Gestión de Reservas</h2>
            <button onclick="mostrarFormReserva()">Nueva Reserva</button>
            <div id="reservasContent"></div>
            
            <div id="reservaForm" style="display: none; margin-top: 20px;">
                <h3 id="reservaFormTitle">Nueva Reserva</h3>
                <form name="reservaForm">
                    <input type="hidden" name="id">
                    <div>
                        <label>Cliente:</label>
                        <input type="text" name="nombre_cliente" required>
                    </div>
                    <div>
                        <label>Teléfono:</label>
                        <input type="text" name="telefono_cliente" required>
                    </div>
                    <div>
                        <label>Cantidad Personas:</label>
                        <input type="number" name="cantidad_personas" required min="1">
                    </div>
                    <div>
                        <label>Fecha:</label>
                        <input type="date" name="fecha" required>
                    </div>
                    <div>
                        <label>Hora:</label>
                        <input type="time" name="hora" required>
                    </div>
                    <div>
                        <label>Mesa:</label>
                        <select name="mesa_id" required></select>
                    </div>
                    <div>
                        <label>Observaciones:</label>
                        <input type="text" name="observaciones">
                    </div>
                    <div>
                        <button type="button" onclick="cancelarReserva()">Cancelar</button>
                        <button type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </section>
        
        <!-- SECCIÓN PRODUCTOS -->
        <section id="productosSection" style="display: none;">
            <button onclick="volverMenu()" class="btn-volver">← Volver al Menú</button>
            <h2>Gestión de Productos</h2>
            <button onclick="mostrarFormProducto()">Nuevo Producto</button>
            <div id="productosContent"></div>
            
            <div id="productoForm" style="display: none; margin-top: 20px;">
                <h3 id="productoFormTitle">Nuevo Producto</h3>
                <form name="productoForm">
                    <input type="hidden" name="id">
                    <div>
                        <label>Nombre:</label>
                        <input type="text" name="nombre" required>
                    </div>
                    <div>
                        <label>Descripción:</label>
                        <input type="text" name="descripcion">
                    </div>
                    <div>
                        <label>Precio:</label>
                        <input type="number" name="precio" required min="1">
                    </div>
                    <div>
                        <label>Categoría:</label>
                        <select name="categoria_id" required></select>
                    </div>
                    <div>
                        <label>Disponible:</label>
                        <select name="disponible">
                            <option value="1">Sí</option>
                            <option value="0">No</option>
                        </select>
                    </div>
                    <div>
                        <button type="button" onclick="cancelarProducto()">Cancelar</button>
                        <button type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </section>
        
        <!-- SECCIÓN PEDIDOS -->
        <section id="pedidosSection" style="display: none;">
            <button onclick="volverMenu()" class="btn-volver">← Volver al Menú</button>
            <h2>Gestión de Pedidos</h2>
            <button onclick="mostrarFormPedido()">Nuevo Pedido</button>
            <div id="pedidosContent"></div>
            
            <div id="pedidoForm" style="display: none; margin-top: 20px;">
                <h3 id="pedidoFormTitle">Nuevo Pedido</h3>
                <form name="pedidoForm">
                    <input type="hidden" name="id">
                    <div>
                        <label>Mesa:</label>
                        <select name="mesa_id" required></select>
                    </div>
                    <div id="productosPedido">
                        <h4>Productos</h4>
                        <div class="producto-item">
                            <select class="producto-select"></select>
                            <input type="number" class="cantidad" value="1" min="1">
                            <button type="button" onclick="agregarProductoPedido()">+</button>
                        </div>
                    </div>
                    <div>
                        <button type="button" onclick="cancelarPedido()">Cancelar</button>
                        <button type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </section>
    </section>
    
    <!-- MODAL PARA MENSAJES -->
    <div id="modal1" class="modal close">
        <div class="modal_content">
            <p id="modalMsg">Mensaje</p>
            <button onclick="hideMsg()">Aceptar</button>
        </div>
    </div>
    
    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/mesas.js"></script>
    <script src="js/reservas.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/pedidos.js"></script>
</body>
</html>
