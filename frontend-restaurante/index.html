<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante XYZ - Login</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/modals.css">
</head>
<body>
    <!-- Logo y Título Principal -->
    <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="60" r="55" fill="none" stroke="#00f3ff" stroke-width="2" opacity="0.6"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.4"/>
            <path d="M35 30 L35 50 M30 30 L30 50 M40 30 L40 50 M32.5 50 L32.5 70" 
                  stroke="#00f3ff" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M80 30 L80 50 L85 50 L85 30 M82.5 50 L82.5 70" 
                  stroke="#ff00ff" stroke-width="3" stroke-linecap="round" fill="none"/>
            <ellipse cx="60" cy="75" rx="25" ry="8" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.8"/>
            <ellipse cx="60" cy="75" rx="18" ry="5" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="1"/>
            <circle cx="60" cy="60" r="3" fill="#ffff00" opacity="0.8">
                <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
            </circle>
        </svg>
        <h1>Restaurante XYZ</h1>
    </div>
    
    <section class="content">
        <!-- LOGIN -->
        <section id="loginSection">
            <div class="section-icon">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="30" cy="22" r="12" fill="none" stroke="#00f3ff" stroke-width="2"/>
                    <path d="M15 52 Q30 38 45 52" fill="none" stroke="#00f3ff" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="30" cy="22" r="4" fill="#00f3ff" opacity="0.5"/>
                </svg>
            </div>
            <h2>Iniciar Sesión</h2>
            <form name="loginForm">
                <div>
                    <label for="usuario">Usuario o Correo:</label>
                    <input type="text" name="usuario" required placeholder="admin">
                </div>
                <div>
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" name="contrasena" required placeholder="admin123">
                </div>
                <div>
                    <button type="submit">Ingresar</button>
                </div>
            </form>
        </section>
        
        <!-- MENÚ PRINCIPAL -->
        <section id="menuSection" style="display: none;">
            <div class="section-icon">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <rect x="15" y="18" width="30" height="22" rx="4" fill="none" stroke="#00f3ff" stroke-width="2"/>
                    <path d="M22 26 L26 26 M22 32 L34 32" stroke="#ff00ff" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="42" cy="26" r="2.5" fill="#00ff88"/>
                    <path d="M18 48 L42 48" stroke="#00f3ff" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h2>Menú Principal</h2>
            <nav>
                <button onclick="mostrarMesas()">Mesas</button>
                <button onclick="mostrarReservas()">Reservas</button>
                <button onclick="mostrarProductos()">Productos</button>
                <button onclick="mostrarPedidos()">Pedidos</button>
                <button onclick="cerrarSesion()">Cerrar Sesión</button>
            </nav>
        </section>
        
        <!-- SECCIÓN MESAS -->
        <section id="mesasSection" style="display: none;">
            <button onclick="volverMenu()" class="btn-volver">← Volver al Menú</button>
            <div class="section-icon">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="15" width="40" height="28" rx="3" fill="none" stroke="#00f3ff" stroke-width="2"/>
                    <path d="M10 24 L50 24" stroke="#ff00ff" stroke-width="1" opacity="0.5"/>
                    <path d="M18 43 L18 52 M42 43 L42 52" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M14 52 L46 52" stroke="#00ff88" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="30" cy="30" r="3" fill="#ffff00" opacity="0.6"/>
                </svg>
            </div>
            <h2>Gestión de Mesas</h2>
            <button onclick="mostrarFormMesa()">Nueva Mesa</button>
            <div id="mesasContent"></div>
            
            <div id="mesaForm" style="display: none; margin-top: 20px;">
                <h3 id="mesaFormTitle">Nueva Mesa</h3>
                <form name="mesaForm">
                    <input type="hidden" name="id">
                    <div>
                        <label>Número:</label>
                        <input type="text" name="numero" required>
                    </div>
                    <div>
                        <label>Capacidad:</label>
                        <input type="number" name="capacidad" required min="1">
                    </div>
                    <div>
                        <label>Estado:</label>
                        <select name="estado">
                            <option value="disponible">Disponible</option>
                            <option value="reservada">Reservada</option>
                            <option value="ocupada">Ocupada</option>
                            <option value="fuera_servicio">Fuera de Servicio</option>
                        </select>
                    </div>
                    <div>
                        <button type="button" onclick="cancelarMesa()">Cancelar</button>
                        <button type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </section>
        
        <!-- SECCIÓN RESERVAS -->
        <section id="reservasSection" style="display: none;">
            <button onclick="volverMenu()" class="btn-volver">← Volver al Menú</button>
            <div class="section-icon">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <rect x="15" y="10" width="30" height="40" rx="3" fill="none" stroke="#00f3ff" stroke-width="2"/>
                    <path d="M15 18 L45 18" stroke="#ff00ff" stroke-width="1" opacity="0.5"/>
                    <path d="M22 26 L26 26 L26 30 L22 30 Z" fill="#00ff88" opacity="0.7"/>
                    <path d="M32 26 L36 26 L36 30 L32 30 Z" fill="#00ff88" opacity="0.7"/>
                    <path d="M22 38 L38 38" stroke="#ffff00" stroke-width="2" stroke-linecap="round"/>
                    <path d="M22 44 L34 44" stroke="#ffff00" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="42" cy="14" r="2.5" fill="#ff00ff"/>
                </svg>
            </div>
            <h2>Gestión de Reservas</h2>
            <button onclick="mostrarFormReserva()">Nueva Reserva</button>
            <div id="reservasContent"></div>
            
            <div id="reservaForm" style="display: none; margin-top: 20px;">
                <h3 id="reservaFormTitle">Nueva Reserva</h3>
                <form name="reservaForm">
                    <input type="hidden" name="id">
                    <div>
                        <label>Cliente:</label>
                        <input type="text" name="nombre_cliente" required>
                    </div>
                    <div>
                        <label>Teléfono:</label>
                        <input type="text" name="telefono_cliente" required>
                    </div>
                    <div>
                        <label>Cantidad Personas:</label>
                        <input type="number" name="cantidad_personas" required min="1">
                    </div>
                    <div>
                        <label>Fecha:</label>
                        <input type="date" name="fecha" required>
                    </div>
                    <div>
                        <label>Hora:</label>
                        <input type="time" name="hora" required>
                    </div>
                    <div>
                        <label>Mesa:</label>
                        <select name="mesa_id" required></select>
                    </div>
                    <div>
                        <label>Observaciones:</label>
                        <input type="text" name="observaciones">
                    </div>
                    <div>
                        <button type="button" onclick="cancelarReserva()">Cancelar</button>
                        <button type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </section>
        
        <!-- SECCIÓN PRODUCTOS -->
        <section id="productosSection" style="display: none;">
            <button onclick="volverMenu()" class="btn-volver">← Volver al Menú</button>
            <div class="section-icon">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 42 Q18 15 30 15 Q42 15 42 42" fill="none" stroke="#00f3ff" stroke-width="2"/>
                    <ellipse cx="30" cy="42" rx="15" ry="6" fill="none" stroke="#ff00ff" stroke-width="2"/>
                    <path d="M26 22 L26 30 M34 22 L34 30" stroke="#00ff88" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="30" cy="34" r="2.5" fill="#ffff00" opacity="0.7"/>
                    <path d="M22 46 L38 46" stroke="#00f3ff" stroke-width="1" opacity="0.5"/>
                </svg>
            </div>
            <h2>Gestión de Productos</h2>
            <button onclick="mostrarFormProducto()">Nuevo Producto</button>
            <div id="productosContent"></div>
            
            <div id="productoForm" style="display: none; margin-top: 20px;">
                <h3 id="productoFormTitle">Nuevo Producto</h3>
                <form name="productoForm">
                    <input type="hidden" name="id">
                    <div>
                        <label>Nombre:</label>
                        <input type="text" name="nombre" required>
                    </div>
                    <div>
                        <label>Descripción:</label>
                        <input type="text" name="descripcion">
                    </div>
                    <div>
                        <label>Precio:</label>
                        <input type="number" name="precio" required min="1">
                    </div>
                    <div>
                        <label>Categoría:</label>
                        <select name="categoria_id" required></select>
                    </div>
                    <div>
                        <label>Disponible:</label>
                        <select name="disponible">
                            <option value="1">Sí</option>
                            <option value="0">No</option>
                        </select>
                    </div>
                    <div>
                        <button type="button" onclick="cancelarProducto()">Cancelar</button>
                        <button type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </section>
        
        <!-- SECCIÓN PEDIDOS -->
        <section id="pedidosSection" style="display: none;">
            <button onclick="volverMenu()" class="btn-volver">← Volver al Menú</button>
            <div class="section-icon">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="15" width="40" height="32" rx="4" fill="none" stroke="#00f3ff" stroke-width="2"/>
                    <path d="M10 24 L50 24" stroke="#ff00ff" stroke-width="1" opacity="0.5"/>
                    <path d="M18 32 L26 32 L22 40 Z" fill="#00ff88" opacity="0.6"/>
                    <circle cx="38" cy="36" r="6" fill="none" stroke="#ffff00" stroke-width="2"/>
                    <path d="M38 30 L38 42 M32 36 L44 36" stroke="#ffff00" stroke-width="1"/>
                    <path d="M14 48 L46 48" stroke="#00f3ff" stroke-width="1" opacity="0.3"/>
                    <circle cx="42" cy="20" r="2" fill="#ff00ff"/>
                </svg>
            </div>
            <h2>Gestión de Pedidos</h2>
            <button onclick="mostrarFormPedido()">Nuevo Pedido</button>
            <div id="pedidosContent"></div>
            
            <div id="pedidoForm" style="display: none; margin-top: 20px;">
                <h3 id="pedidoFormTitle">Nuevo Pedido</h3>
                <form name="pedidoForm">
                    <input type="hidden" name="id">
                    <div>
                        <label>Mesa:</label>
                        <select name="mesa_id" required></select>
                    </div>
                    <div id="productosPedido">
                        <h4>Productos</h4>
                        <div class="producto-item">
                            <select class="producto-select"></select>
                            <input type="number" class="cantidad" value="1" min="1">
                            <button type="button" onclick="agregarProductoPedido()">+</button>
                        </div>
                    </div>
                    <div>
                        <button type="button" onclick="cancelarPedido()">Cancelar</button>
                        <button type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </section>
    </section>
    
    <!-- MODAL PARA MENSAJES -->
    <div id="modal1" class="modal close">
        <div class="modal_content">
            <p id="modalMsg">Mensaje</p>
            <button onclick="hideMsg()">Aceptar</button>
        </div>
    </div>
    
    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/mesas.js"></script>
    <script src="js/reservas.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/pedidos.js"></script>
</body>
</html>
